# The plugin installed into a real Moodle and tested there:
# Moodle's own checks (lint, code style, docs, plugin validation) plus our PHPUnit and Behat tests.
# KSE ran Moodle 4.2 and moved to 5.x by 2026-11-21: every branch from 4.2 to 5.3 is checked.
name: Moodle plugin

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04

    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.0'
            moodle-branch: 'MOODLE_402_STABLE'
            postgres: '14'
          - php: '8.2'
            moodle-branch: 'MOODLE_402_STABLE'
            postgres: '14'
          - php: '8.3'
            moodle-branch: 'MOODLE_405_STABLE'
            postgres: '14'
          # KSE moved to Moodle 5 (Bootstrap 5 in its theme since 2026-11-21); the exact 5.x is hidden, so all of them
          - php: '8.3'
            moodle-branch: 'MOODLE_500_STABLE'
            postgres: '14'
          - php: '8.3'
            moodle-branch: 'MOODLE_501_STABLE'
            postgres: '15'
          - php: '8.3'
            moodle-branch: 'MOODLE_502_STABLE'
            postgres: '16'
          - php: '8.3'
            moodle-branch: 'MOODLE_503_STABLE'
            postgres: '17'

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          ini-values: max_input_vars=5000
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      - name: Install moodle-plugin-ci
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: pgsql
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - name: PHP Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint

      - name: Moodle Code Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: Moodle PHPDoc Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Validating
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints

      - name: PHPUnit tests
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit --fail-on-warning

      - name: Behat features
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci behat --profile chrome
